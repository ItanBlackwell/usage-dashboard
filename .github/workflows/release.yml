name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            test "$GITHUB_REF" = refs/heads/main
          fi

  windows-installer-smoke:
    needs: verify-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem installer -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Invalid PowerShell: $($_.Name): $($errors -join '; ')" }
          }
      - name: Install and uninstall in isolated directory (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'usage-dashboard-release-smoke'
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          $target = Join-Path $env:OPENCODE_CONFIG_DIR 'plugins/usage-dashboard'
          if (-not (Test-Path (Join-Path $target 'dist/gui-experimental.cjs'))) { throw 'Bundle missing' }
          if (Test-Path (Join-Path $target 'installer/BillingWindow.ps1')) { throw 'Retired helper installed' }
          if (Test-Path (Join-Path $target 'node_modules/playwright-core')) { throw 'Retired runtime installed' }
          if (Test-Path -LiteralPath (Join-Path $target 'browser-extension')) { throw 'Retired companion installed' }
          & ./installer/Uninstall-UsageDashboard.ps1 -PurgeCachedData
          if (Test-Path $target) { throw 'Uninstaller did not remove plugin' }

  package:
    needs: [windows-installer-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
      - name: Build and validate
        run: |
          set -e
          for file in src/*.cjs build.cjs; do node --check "$file"; done
          node build.cjs
          git diff --exit-code -- dist/gui-experimental.cjs
          node --check dist/gui-experimental.cjs
          python3 tools/make-distributions.py
      - name: Checksums
        run: (cd release && sha256sum Usage-Dashboard-*.zip > SHA256SUMS.txt)
      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            RELEASE_NOTES.md
            package.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
      - name: Verify package checksums
        run: cd release && sha256sum -c SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version | select(test("^[0-9]+\\\\.[0-9]+\\\\.[0-9]+$"))' package.json)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG is already published. No changes were made."
            exit 0
          fi
          gh release create "$TAG" \
            "release/Usage-Dashboard-Portable-${VERSION}.zip" \
            "release/Usage-Dashboard-Source-${VERSION}.zip" \
            "release/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "Usage Dashboard ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest
