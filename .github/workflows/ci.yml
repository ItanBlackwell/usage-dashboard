name: CI

on:
  push:
    branches: [main, fix/api-balance-availability]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and build checks
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.cjs build.cjs; do node --check "$file"; done
          node build.cjs
          node --check dist/gui-experimental.cjs
          node -e 'const p=require("./package.json");if(p.name!=="usage-dashboard"||!p.exports?.["./gui-experimental"])process.exit(1)'
      - name: Verify balance presentation and IPC fallback
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./src/presentation.cjs');
          const a = {id:'openrouter:a',provider:'openrouter',kind:'api',source:'OpenCode',state:'ok',message:'ok',active:true,balance:{amount:0,currency:'USD',kind:'balance'},balances:[],windows:[],credits:null,checkedAt:42};
          const placeholder = {...a,active:false,state:'unavailable',message:'plugin_ipc_unavailable',balance:null,checkedAt:0};
          const prior = {accounts:[a]};
          const m = p.mergeInventoryFallback({accounts:[placeholder]},prior);
          assert.equal(m.accounts[0].balance.amount,0);
          assert.equal(m.accounts[0].state,'stale');
          assert.equal(m.accounts[0].message,'plugin_ipc_unavailable');
          assert.equal(p.mergeInventoryFallback({accounts:[{...placeholder,id:'openrouter:b'}]},prior).accounts[0].balance,null);
          assert.equal(p.mergeInventoryFallback({accounts:[]},prior).accounts.length,0);
          assert.equal(p.formatCurrency(0,'USD'),'$0.00');
          assert.equal(p.formatCurrency(0,'CNY'),'¥0.00');
          assert.equal(p.formatCurrency(null,'USD'),'—');
          const cache = require('./src/cache.cjs');
          const b = {...a,id:'openai:a',provider:'codex',balance:null,message:'api_key_connected'};
          const other = {...b,id:'openai:b'};
          const zen = {...b,id:'opencode:a',provider:'opencode'};
          const legacy = {accounts:[b,other,zen],browserBalance:{usd:7,currency:'USD'},zenBrowserBalance:{usd:0,currency:'USD'}};
          const sanitized=cache.sanitizeSnapshot(legacy);
          assert.equal(Object.hasOwn(sanitized,'browserBalance'),false);
          assert.equal(Object.hasOwn(sanitized,'zenBrowserBalance'),false);
          assert.equal(p.indicatorPresentation(b,legacy).amount,null);
          assert.equal(p.indicatorPresentation(zen,legacy).amount,null);
          const previous=cache.sanitizeSnapshot({...legacy,billingSessions:[{id:b.id,provider:b.provider,state:'ok',amount:0,checkedAt:42}]});
          assert.equal(p.indicatorPresentation(b,previous).amount,0);
          assert.equal(p.indicatorPresentation(other,previous).amount,null);
          assert.equal(p.indicatorPresentation(zen,previous).amount,null);
          const merged=p.mergeInventoryFallback({accounts:[b,other,zen]},previous);
          assert.equal(p.billingSessionBalance(b,merged).usd,0);
          assert.equal(merged.billingSessions[0].state,'stale');
          assert.equal(p.billingSessionBalance(other,merged),null);
          NODE
      - name: Verify Billing action responses
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs/promises');
          const os=require('node:os');
          const path=require('node:path');
          const {createBillingSessions}=require('./src/billing-session.cjs');
          (async()=>{
            const dir=await fs.mkdtemp(path.join(os.tmpdir(),'ud-billing-'));
            const a={id:'openai:test',provider:'codex',kind:'api',source:'OpenCode',message:'api_key_connected'};
            let snapshot={accounts:[a],billingSessions:[],inventoryWarning:'credentials_unavailable'};
            let refreshCount=0;
            const store={cached:async()=>snapshot,refresh:async()=>{refreshCount++;return snapshot;},
              setBillingSession:async(id,provider,s)=>{snapshot={...snapshot,billingSessions:s?[s]:[]};return snapshot;}};
            const service=createBillingSessions({directory:dir,store,chromiumLoader:()=>{throw Error('private path');}});
            try{
              const blocked=await service.action(a.id,'open');
              assert.equal(blocked.accepted,false);
              assert.equal(blocked.reason,'inventory_unavailable');
              assert.equal(refreshCount,1);
              snapshot={...snapshot,inventoryWarning:null};
              const missing=await service.action(a.id,'open');
              assert.equal(missing.accepted,true);
              assert.equal(missing.snapshot.billingSessions[0].state,'runtime_missing');
              assert.equal((await service.action('unknown','open')).reason,'account_unavailable');
              assert.equal((await service.action(a.id,'invalid')).reason,'invalid_action');
            }finally{await service.stop();await fs.rm(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify automatic Billing completion after manual browser login
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs/promises');
          const os=require('node:os');
          const path=require('node:path');
          const {createBillingSessions,startLoginBrowser}=require('./src/billing-session.cjs');
          const {EventEmitter}=require('node:events');
          (async()=>{
            const dir=await fs.mkdtemp(path.join(os.tmpdir(),'ud-manual-login-'));
            const a={id:'openai:test',provider:'codex',kind:'api',source:'OpenCode',message:'api_key_connected'};
            const url='https://platform.openai.com/settings/organization/billing/overview';
            let snapshot={accounts:[a],billingSessions:[],inventoryWarning:null};
            let running=true,manualLaunches=0,automatedLaunches=0,closed=0,discoveries=0;
            let onExit=null,notifyExit=true,discoveryState='page_detected';
            const store={cached:async()=>snapshot,refresh:async()=>snapshot,
              setBillingSession:async(id,provider,s)=>{snapshot={...snapshot,billingSessions:s?[s]:[]};return snapshot;}};
            const page={url:()=>url,route:async()=>{},goto:async()=>{},evaluate:async()=>0};
            const context={pages:()=>[page],once:()=>{},close:async()=>{closed++;}};
            const service=createBillingSessions({directory:dir,store,
              defaultBrowser:async()=> 'msedge',
              browserFinder:async()=>({channel:'msedge',executablePath:'edge.exe'}),
              retryWait:async()=>{},
              pageDiscovery:async()=>{
                discoveries++;
                if(discoveryState==='page_detected'&&discoveries===1)return {state:'billing_page_missing'};
                return discoveryState==='page_detected'?{state:discoveryState,url}:{state:discoveryState};
              },
              loginLauncher:async({url:target,profilePath})=>{
                manualLaunches++;assert.equal(target,url);assert.ok(profilePath.startsWith(dir));
                return {isRunning:()=>running,...(notifyExit?{onExit:fn=>{onExit=fn;}}:{})};
              },
              chromiumLoader:()=>({launchPersistentContext:async(profilePath,options)=>{
                automatedLaunches++;assert.equal(options.headless,true);assert.ok(profilePath.startsWith(dir));return context;
              }})});
            try{
              assert.equal((await service.action(a.id,'open')).snapshot.billingSessions[0].state,'awaiting_login');
              assert.equal(manualLaunches,1);assert.equal(automatedLaunches,0);
              assert.equal((await service.action(a.id,'confirm')).reason,'invalid_action');
              await service.tick();
              assert.equal(discoveries,0);assert.equal(automatedLaunches,0);
              running=false;
              assert.equal(typeof onExit,'function');
              onExit();onExit(); // duplicate exit signals cannot duplicate reads
              await service.tick();
              for(let i=0;i<100&&snapshot.billingSessions[0]?.state!=='ok';i++)
                await new Promise(resolve=>setTimeout(resolve,20));
              assert.equal(snapshot.billingSessions[0].state,'ok');
              assert.equal(snapshot.billingSessions[0].amount,0);
              assert.equal(automatedLaunches,1);assert.equal(closed,1);
              assert.equal(discoveries,2); // bounded retry while history flushes
              assert.equal((await service.action(a.id,'disconnect')).snapshot.billingSessions.length,0);
              running=true;notifyExit=false;discoveries=0;discoveryState='billing_page_ambiguous';
              await service.action(a.id,'open');
              running=false;
              // Simulate watchdog/refresh when a browser does not deliver exit.
              await service.tick();
              assert.equal(snapshot.billingSessions[0].state,'billing_page_ambiguous');
              assert.equal(automatedLaunches,1);
              await service.tick();
              assert.equal(discoveries,1); // ambiguity is terminal for this attempt
              assert.equal((await service.action(a.id,'disconnect')).snapshot.billingSessions.length,0);
              running=true;discoveryState='page_detected';discoveries=0;
              await service.action(a.id,'open');
              running=false;
              await service.tick();
              assert.equal(snapshot.billingSessions[0].state,'ok');
              assert.equal(snapshot.billingSessions[0].amount,0);
              assert.equal(automatedLaunches,2);assert.equal(closed,2);
              const child=new EventEmitter();child.exitCode=null;child.signalCode=null;child.unref=()=>{};
              const native=await startLoginBrowser({browser:{executablePath:'edge.exe'},profilePath:dir,url,env:{OPENAI_API_KEY:'secret'},
                spawn:(executable,args,options)=>{
                  assert.equal(executable,'edge.exe');
                  assert.equal(options.shell,false);
                  assert.equal(options.env.OPENAI_API_KEY,undefined);
                  assert.ok(args.includes('--user-data-dir='+dir));
                  assert.ok(args.includes(url));
                  assert.ok(!args.some(a=>/remote-debugging|enable-automation|no-sandbox/.test(a)));
                  assert.ok(args.includes('--force-renderer-accessibility=complete'));
                  queueMicrotask(()=>child.emit('spawn'));return child;
                }});
              assert.equal(native.isRunning(),true);
            }finally{await service.stop();await fs.rm(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify isolated window auto-close policy
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs/promises');
          const os=require('node:os');
          const path=require('node:path');
          const {createBillingSessions,inspectBillingWindow}=require('./src/billing-session.cjs');
          (async()=>{
            const dir=await fs.mkdtemp(path.join(os.tmpdir(),'ud-window-'));
            const a={id:'openai:fixture',provider:'codex',kind:'api',source:'OpenCode',message:'api_key_connected'};
            const url='https://platform.openai.com/settings/organization/billing/overview';
            let snapshot={accounts:[a],billingSessions:[],inventoryWarning:null};
            let now=Date.now(),running=true,exit=null,probes=0,closes=0,reads=0;
            let observed={state:'not_ready'};
            const store={cached:async()=>snapshot,refresh:async()=>snapshot,
              setBillingSession:async(id,p,s)=>{snapshot={...snapshot,billingSessions:s?[s]:[]};return snapshot;}};
            const page={url:()=>url,route:async()=>{},goto:async()=>{},evaluate:async()=>0};
            const service=createBillingSessions({directory:dir,store,clock:()=>now,retryWait:async()=>{},
              defaultBrowser:async()=> 'msedge',browserFinder:async()=>({channel:'msedge',executablePath:'edge.exe'}),
              loginLauncher:async()=>({pid:12345,isRunning:()=>running,onExit:fn=>{exit=fn;}}),
              pageDiscovery:async()=>({state:'page_detected',url}),
              windowInspector:async input=>{
                probes++;assert.equal(input.pid,12345);assert.ok(input.profilePath.startsWith(dir));
                if(input.expected){
                  assert.equal(input.expected.url,url);assert.equal(input.expected.window,99);
                  // The helper revalidates the current evidence at close time.
                  if(observed.state==='ready'&&observed.url===input.expected.url&&observed.window===input.expected.window){
                    closes++;running=false;exit();
                    return {state:'close_requested',url,window:99};
                  }
                }
                return observed;
              },
              chromiumLoader:()=>({launchPersistentContext:async()=>{
                assert.equal(running,false);reads++;return {pages:()=>[page],once:()=>{},close:async()=>{}};
              }})});
            try{
              await service.action(a.id,'open');
              await service.tick();assert.equal(closes,0);assert.equal(reads,0);
              observed={state:'ready',url:'https://accounts.google.com/signin',window:99};
              now+=4000;await service.tick();assert.equal(closes,0);
              observed={state:'ready',url,window:99};
              now+=4000;await service.tick();
              now+=4000;await service.tick();assert.equal(closes,0);
              // A changed/uncertain page resets the stability period.
              observed={state:'not_ready'};
              now+=1000;await service.tick();assert.equal(closes,0);
              now+=4000;await service.tick();
              observed={state:'ready',url,window:99};
              now+=4000;await service.tick();
              now+=4000;await service.tick();assert.equal(closes,0);
              now+=4000;await service.tick();
              for(let i=0;i<100&&snapshot.billingSessions[0]?.state!=='ok';i++)
                await new Promise(resolve=>setTimeout(resolve,20));
              assert.equal(closes,1);assert.equal(reads,1);
              assert.equal(snapshot.billingSessions[0].state,'ok');
              assert.equal(snapshot.billingSessions[0].amount,0);
              assert.ok(probes>=5);
              const invalid=await inspectBillingWindow({platform:'linux',execFile:()=>{throw Error('must not execute');}});
              assert.equal(invalid.state,'unavailable');
            }finally{await service.stop();await fs.rm(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify automatic Billing page discovery
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs/promises');
          const os=require('node:os');
          const path=require('node:path');
          const {DatabaseSync}=require('node:sqlite');
          const {discoverBillingPage,sessionBillingPages}=require('./src/billing-session.cjs');
          (async()=>{
            const dir=await fs.mkdtemp(path.join(os.tmpdir(),'ud-billing-pages-'));
            const since=Date.now();
            const now=BigInt(since)*1000n+11644473600000000n;
            const base='https://opencode.ai/workspace/test-a/billing';
            const other='https://opencode.ai/workspace/test-b/billing';
            const profile=path.join(dir,'Default');
            await fs.mkdir(profile);
            const file=path.join(profile,'History');
            const db=new DatabaseSync(file);
            try{
              db.exec('CREATE TABLE urls (url TEXT, last_visit_time INTEGER)');
              const insert=db.prepare('INSERT INTO urls VALUES (?,?)');
              insert.run(base+'?unrelated=private',now);
              insert.run(other,now-1000n);
              insert.run('https://accounts.google.com/signin?code=private',now);
              insert.run('https://opencode.ai.evil.invalid/workspace/test-c/billing',now);
              const discover=()=>discoverBillingPage({provider:'opencode',profilePath:dir,since});
              assert.deepEqual(await discover(),{state:'page_detected',url:base});
              insert.run(other,now);
              assert.deepEqual(await discover(),{state:'billing_page_ambiguous'});
              assert.deepEqual(await discoverBillingPage({provider:'codex',profilePath:dir,since}),{state:'billing_page_missing'});
              // Synthetic cleartext Chromium navigation records, including
              // the original navigation timestamp and empty optional strings.
              const navRecord=(url,timestamp)=>{
                const nav=Buffer.from(url);
                const p=16+Math.ceil(nav.length/4)*4;
                const payload=Buffer.alloc(p+40);
                payload.writeUInt32LE(payload.length-4,0);payload.writeInt32LE(1,4);
                payload.writeInt32LE(0,8);payload.writeInt32LE(nav.length,12);nav.copy(payload,16);
                payload.writeBigInt64LE(timestamp,p+32);
                const cmd=Buffer.alloc(3);cmd.writeUInt16LE(payload.length+1);cmd[2]=6;
                return Buffer.concat([cmd,payload]);
              };
              const header=Buffer.alloc(8);header.write('SNSS');header.writeUInt32LE(3,4);
              const data=Buffer.concat([header,navRecord(other,now-1000n),navRecord(base,now),
                navRecord('https://accounts.google.com/signin?code=private',now)]);
              assert.deepEqual(sessionBillingPages(data,'opencode',since),[base]);
              assert.deepEqual(sessionBillingPages(data,'opencode',since+1),[]);
              const encrypted=Buffer.from(data);encrypted.writeUInt32LE(5,4);
              assert.equal(sessionBillingPages(encrypted,'opencode',since),null);
              assert.equal(sessionBillingPages(data.subarray(0,-1),'opencode',since),null);
              const sessions=path.join(profile,'Sessions');await fs.mkdir(sessions);
              await fs.writeFile(path.join(sessions,'Session_'+now),data);
              const fallback=await discoverBillingPage({provider:'opencode',profilePath:dir,since,loadSQLite:()=>{throw Error('not available');}});
              assert.deepEqual(fallback,{state:'page_detected',url:base});
            }finally{db.close();await fs.rm(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify system-default Billing browser selection
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {BROWSERS,browserFromProgId,browserExecutable,browserVariant,defaultWindowsBrowser,selectBillingBrowser,playwrightBrowserChannel,createBillingSessions}=require('./src/billing-session.cjs');
          (async()=>{
            assert.equal(browserFromProgId('ChromeHTML'),'chrome');
            assert.equal(browserFromProgId('MSEdgeHTM'),'msedge');
            assert.equal(browserFromProgId('FirefoxURL-123'),null);
            assert.equal(browserFromProgId('BraveHTML'),'brave');
            assert.equal(browserFromProgId('BraveHTML.1234'),'brave');
            assert.equal(browserFromProgId('ChromeBHTML'),'chrome-beta');
            assert.equal(browserFromProgId('MSEdgeDHTML'),'msedge-dev');
            assert.equal(browserFromProgId('OperaGXStable'),'opera-gx');
            assert.equal(browserFromProgId('VivaldiHTM'),'vivaldi');
            assert.equal(browserFromProgId('ChromiumHTM.abc'),'chromium');
            assert.equal(browserFromProgId('YandexHTML'),'yandex');
            assert.equal(Object.keys(BROWSERS).length,26);
            assert.equal(playwrightBrowserChannel('brave'),'chromium');
            assert.equal(playwrightBrowserChannel('opera-gx'),'chromium');
            assert.equal(playwrightBrowserChannel('chrome-beta'),'chrome-beta');
            const defaultBrowser=async()=> 'chrome';
            const env={SystemRoot:'C:\\Windows',OPENAI_API_KEY:'not-for-child'};
            const channel=await defaultWindowsBrowser(env,'win32',(exe,args,opts,done)=>{
              assert.equal(exe,'C:\\Windows\\System32\\reg.exe');
              assert.equal(opts.shell,false);
              assert.equal(opts.env.OPENAI_API_KEY,undefined);
              if(args[1].includes('\\https\\UserChoice'))done(null,'    ProgId    REG_SZ    BraveHTML.123\r\n');
              else{
                assert.equal(args[1],'HKCR\\BraveHTML.123\\shell\\open\\command');
                done(null,'    (Default)    REG_SZ    "D:\\Browsers\\Brave\\brave.exe" -- "%1"\r\n');
              }
            });
            assert.equal(channel.channel,'brave');
            assert.equal(channel.executablePath,'D:\\Browsers\\Brave\\brave.exe');
            assert.equal(browserExecutable('"C:\\Apps\\evil.exe" "%1"'),'C:\\Apps\\evil.exe');
            assert.equal(browserExecutable('cmd.exe /c evil'),null);
            assert.equal(browserExecutable('"\\\\server\\share\\brave.exe" "%1"'),null);
            assert.equal(browserVariant('brave','C:\\Program Files\\BraveSoftware\\Brave-Browser-Beta\\Application\\brave.exe'),'brave-beta');
            assert.equal(await defaultWindowsBrowser(env,'linux',()=>{throw Error('unexpected');}),null);
            const available=new Set(['msedge','chrome']);
            const browserFinder=async channel=>available.has(channel)?{channel,executablePath:channel+'.exe'}:null;
            const select=(opts={})=>selectBillingBrowser({defaultBrowser,browserFinder,env,...opts});
            assert.equal((await select()).browser.channel,'chrome');
            assert.equal((await select({preferred:'msedge'})).browser.channel,'msedge');
            assert.equal((await select({explicit:'msedge'})).browser.channel,'msedge');
            assert.deepEqual((await select({defaultBrowser:async()=>null})).choices,['msedge','chrome']);
            const custom=await select({defaultBrowser:async()=>channel,access:async()=>{}});
            assert.equal(custom.browser.channel,'brave');
            assert.equal(custom.browser.executablePath,channel.executablePath);
            available.delete('chrome');
            assert.deepEqual((await select()).choices,['msedge']);
            assert.equal((await select({explicit:'msedge'})).browser.channel,'msedge');
            available.clear();
            assert.equal((await select()).state,'browser_missing');
            const account={id:'openai:fixture',provider:'codex',kind:'api',message:'api_key_connected'};
            let snapshot={accounts:[account],billingSessions:[],inventoryWarning:null},launches=0;
            available.add('msedge');
            const service=createBillingSessions({
              directory:'fixture',env,defaultBrowser,browserFinder,
              store:{cached:async()=>snapshot,setBillingSession:async(id,p,s)=>{snapshot={...snapshot,billingSessions:[s]};return snapshot;}},
              io:{readFile:async()=>{throw Error('missing');},rm:async()=>{},mkdir:async()=>{}},
              chromiumLoader:()=>({launchPersistentContext:()=>{throw Error('must not automate login');}}),
              loginLauncher:async({browser})=>{assert.equal(browser.channel,'msedge');launches++;return {isRunning:()=>true};}
            });
            try{
              const choice=await service.action(account.id,'open');
              assert.equal(choice.snapshot.billingSessions[0].state,'choose_browser');
              assert.deepEqual(choice.snapshot.billingSessions[0].browserChoices,['msedge']);
              assert.equal(launches,0);
              assert.equal((await service.action(account.id,'open_edge')).snapshot.billingSessions[0].state,'awaiting_login');
              assert.equal(launches,1);
            }finally{await service.stop();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify independent Billing command transport
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {createBillingCommands}=require('./src/billing-session.cjs');
          (async()=>{
            let finish, calls=0;
            const task=new Promise(resolve=>{finish=resolve;});
            const cmd=createBillingCommands({action:async()=>{calls++;return task;}});
            const input={id:'openai:fixture',action:'open',ticket:'request-1'};
            assert.equal(cmd.submit(input),'queued');
            assert.equal(cmd.status(input),'pending');
            assert.equal(cmd.submit(input),'queued');
            assert.equal(cmd.submit({...input,ticket:'request-2'}),'busy');
            await new Promise(resolve=>setImmediate(resolve));
            assert.equal(calls,1);
            finish({accepted:false,reason:'inventory_unavailable'});
            await new Promise(resolve=>setImmediate(resolve));
            assert.equal(cmd.status(input),'inventory_unavailable');
            assert.equal(cmd.status({...input,ticket:'wrong'}),'unknown');
            assert.equal(cmd.submit({...input,action:'other'}),'invalid_action');
            cmd.stop();
            assert.equal(cmd.submit(input),'service_unavailable');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Package and verify archives without test scripts or secrets
        shell: bash
        run: |
          python3 tools/make-distributions.py
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, zipfile
          version=json.loads(Path('package.json').read_text())['version']
          for kind in ('Portable','Source'):
              path=Path('release')/f'Usage-Dashboard-{kind}-{version}.zip'
              assert path.is_file(), path
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert names and not any('/tests/' in '/'+name or name.endswith('Test-UsageDashboard.ps1') for name in names)
                  assert not any(name.endswith(('pairing.json','settings.json','binding.json','snapshot.json','.env')) for name in names)
                  assert not any('billing-sessions/' in name or '.usage-dashboard-userdata/' in name for name in names)
                  assert not any('/browser-extension/' in name or name.endswith(('/balance-bridge.cjs','/BROWSER_EXTENSION.md')) for name in names)
                  if kind == 'Portable':
                      assert 'Usage-Dashboard/vendor/playwright-core.tgz' in names
                      assert 'Usage-Dashboard/billing-runtime.json' in names
                      assert 'Usage-Dashboard/installer/BillingWindow.ps1' in names
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Usage-Dashboard-test-build
          path: release/*.zip
          if-no-files-found: error

  windows-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem installer -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Invalid PowerShell: $($_.Name): $($errors -join '; ')" }
          }
      - name: Verify Billing Session browser selection
        shell: pwsh
        run: |
          @'
          const assert=require('node:assert/strict');
          const path=require('node:path');
          const {findBrowser}=require('./src/billing-session.cjs');
          (async()=>{
            const root=path.join(process.env.RUNNER_TEMP,'billing-browser-fixture');
            const edge=path.join(root,'Microsoft','Edge','Application','msedge.exe');
            const chrome=path.join(root,'Google','Chrome','Application','chrome.exe');
            const installed=new Set([edge,chrome]);
            const access=async p=>{if(!installed.has(p))throw Error('missing');};
            const env={ProgramFiles:root};
            assert.equal((await findBrowser(null,env,access)).executablePath,edge);
            installed.delete(edge);
            assert.equal((await findBrowser(null,env,access)).executablePath,chrome);
            installed.delete(chrome);
            assert.equal(await findBrowser(null,env,access),null);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Browser selection check failed' }
      - name: Clean-room installation and removal smoke check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'usage-dashboard-smoke'
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer failed' }
          $target = Join-Path $env:OPENCODE_CONFIG_DIR 'plugins/usage-dashboard'
          if (-not (Test-Path (Join-Path $target 'dist/gui-experimental.cjs'))) { throw 'Bundle missing after installation' }
          $helper = Join-Path $target 'installer/BillingWindow.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'Billing window helper missing' }
          # Validate the actual helper's URL and amount parsers without reading
          # a live provider page or a user's browser.
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($helper,[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count) { throw 'Invalid Billing window helper' }
          foreach ($name in @('Get-CanonicalBillingUrl','Get-UsdAmount')) {
            $fn = $ast.Find({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name},$true)
            if (-not $fn) { throw "Missing helper function: $name" }
            . ([scriptblock]::Create($fn.Extent.Text))
          }
          $Provider = 'codex'
          $url = 'https://platform.openai.com/settings/organization/billing/overview'
          if ((Get-CanonicalBillingUrl ($url+'?organization=org-test&code=private')) -cne ($url+'?organization=org-test')) { throw 'Billing URL canonicalization failed' }
          if ($null -ne (Get-CanonicalBillingUrl 'https://accounts.google.com/signin')) { throw 'Login URL accepted' }
          if ($null -ne (Get-CanonicalBillingUrl 'https://platform.openai.com.example.invalid/settings/organization/billing/overview')) { throw 'Foreign origin accepted' }
          if ($null -eq (Get-UsdAmount '$0.00') -or (Get-UsdAmount '$0.00') -ne 0) { throw 'Zero balance rejected' }
          if ($null -ne (Get-UsdAmount 'Balance unknown')) { throw 'Unknown amount accepted' }
          if ((Get-UsdAmount 'USD 0.012345') -ne [decimal]0.012345) { throw 'Fractional credits rejected' }
          if ((Get-UsdAmount '1 234,56 USD') -ne [decimal]1234.56) { throw 'Localized amount rejected' }
          if ($null -ne (Get-UsdAmount '10 EUR')) { throw 'Foreign currency accepted' }
          # Negative test: a real unrelated process without the dedicated profile
          # argument must never be accepted, even with its real PID and path.
          $self = Get-Process -Id $PID
          $epoch = [DateTime]::SpecifyKind([DateTime]'1970-01-01',[DateTimeKind]::Utc)
          $born = [long]($self.StartTime.ToUniversalTime()-$epoch).TotalMilliseconds
          $result = & powershell.exe -NoProfile -NonInteractive -MTA -ExecutionPolicy Bypass -File $helper -BrowserProcessId $PID -BrowserExecutable $self.Path -ProfileDirectory (Join-Path $env:RUNNER_TEMP 'unrelated-profile') -Provider codex -StartedAt $born
          if (($result | ConvertFrom-Json).state -ne 'unavailable') { throw 'Unrelated process was accepted by Billing window helper' }
          if (Test-Path -LiteralPath (Join-Path $target 'browser-extension')) { throw 'Retired companion installed' }
          $runtime = Join-Path $target 'node_modules/playwright-core/package.json'
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw 'Billing runtime missing' }
          $pin = Get-Content billing-runtime.json -Raw | ConvertFrom-Json
          if ((Get-Content -LiteralPath $runtime -Raw | ConvertFrom-Json).version -cne $pin.version) { throw 'Wrong Billing runtime' }
          $env:USAGE_DASHBOARD_SMOKE_PLUGIN = $target
          node -e "const path=require('node:path');const p=require(path.join(process.env.USAGE_DASHBOARD_SMOKE_PLUGIN,'node_modules','playwright-core'));if(typeof p.chromium?.launchPersistentContext!=='function')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Billing runtime cannot be loaded' }
          $env:USAGE_DASHBOARD_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'usage-dashboard-browser-smoke'
          @'
          const path=require('node:path');
          const fs=require('node:fs/promises');
          const {chromium}=require(path.join(process.env.USAGE_DASHBOARD_SMOKE_PLUGIN,'node_modules','playwright-core'));
          const {findBrowser,browserEnvironment,readBillingAmount,playwrightBrowserChannel}=require('./src/billing-session.cjs');
          (async()=>{
            const browser=await findBrowser();
            if(!browser)throw Error('No supported browser on Windows runner');
            const profile=process.env.USAGE_DASHBOARD_SMOKE_PROFILE;
            let context;
            try{
              context=await chromium.launchPersistentContext(profile,{
                channel:playwrightBrowserChannel(browser.channel),executablePath:browser.executablePath,headless:true,
                viewport:null,acceptDownloads:false,chromiumSandbox:true,timeout:15000,
                handleSIGINT:false,handleSIGTERM:false,handleSIGHUP:false,
                args:['--disable-background-mode','--disable-sync'],env:browserEnvironment(process.env)
              });
              const page=context.pages()[0]||await context.newPage();
              await page.setContent('<title>Usage Dashboard smoke</title><p>Credit balance</p><p>$0.00</p>');
              const value=await page.evaluate(readBillingAmount,'codex');
              if(value!==0)throw Error('Synthetic zero balance was not recognized');
              const assert=require('node:assert/strict');
              const check=async(html,provider,state,amount=null)=>{
                await page.setContent(html);
                assert.deepEqual(await page.evaluate(readBillingAmount,{provider,diagnostic:true}),{state,amount});
              };
              await check('<main><section><div><h2>Credit balance</h2></div><div><span>$</span> <span>0.012345</span></div><button>Add credits</button></section><section><h2>Monthly budget</h2><p>$100.00</p></section></main>','codex','ok',0.012345);
              await check('<main><div><span>Available credits</span><span>1 234,56 USD</span></div><div>Balance $90.00</div></main>','opencode','ok',1234.56);
              await check('<main><p>\u0411\u0430\u043b\u0430\u043d\u0441 \u043a\u0440\u0435\u0434\u0438\u0442\u043e\u0432</p><p>$0.00</p></main>','codex','ok',0);
              await check('<main><p>Monthly budget</p><p>$100</p></main>','codex','billing_label_missing');
              await check('<main><p>Credit balance</p><p>Not available</p><p>$99</p></main>','codex','billing_value_missing');
              await check('<main><p>Credit balance $2</p><p>Available balance $3</p></main>','codex','billing_value_ambiguous');
              await check('<main><p>Credit balance</p><p>0 EUR</p></main>','codex','billing_value_missing');
            }finally{if(context)await context.close();await fs.rm(profile,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Billing browser launch smoke failed' }
          $saved = Join-Path $env:OPENCODE_CONFIG_DIR '.usage-dashboard-userdata'
          $legacy = Join-Path $target 'browser-extension'
          $savedLegacy = Join-Path $saved 'browser-extension'
          foreach ($folder in @($legacy,$savedLegacy)) {
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            foreach ($name in @('manifest.json','background.js','content.js','pairing.json')) {
              [IO.File]::WriteAllText((Join-Path $folder $name),'synthetic legacy fixture')
            }
          }
          $unrelated = Join-Path $savedLegacy 'user-note.txt'
          [IO.File]::WriteAllText($unrelated,'keep')
          $session = Join-Path $saved 'billing-sessions/test-profile'
          New-Item -ItemType Directory -Path $session -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $session 'fixture.txt'),'keep')
          $settings = Join-Path $target 'settings.json'
          [IO.File]::WriteAllText($settings,'{"refreshMinutes":17}')
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer upgrade failed' }
          if (Test-Path -LiteralPath $legacy) { throw 'Retired companion not removed' }
          if (Test-Path -LiteralPath (Join-Path $savedLegacy 'pairing.json')) { throw 'Retired saved pairing not removed' }
          if (-not (Test-Path -LiteralPath $unrelated)) { throw 'Unrelated file removed' }
          if (-not (Test-Path -LiteralPath (Join-Path $session 'fixture.txt'))) { throw 'Billing Session profile removed on upgrade' }
          if ((Get-Content -LiteralPath $settings -Raw | ConvertFrom-Json).refreshMinutes -ne 17) { throw 'Settings changed on upgrade' }
          & ./installer/Uninstall-UsageDashboard.ps1 -PurgeCachedData
          if (-not $?) { throw 'Uninstaller failed' }
          if (Test-Path $target) { throw 'Plugin still installed' }
