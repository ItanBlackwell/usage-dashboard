name: CI

on:
  push:
    branches: [main, fix/api-balance-availability]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and build checks
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.cjs build.cjs; do node --check "$file"; done
          node build.cjs
          node --check dist/gui-experimental.cjs
          node -e 'const p=require("./package.json");if(p.name!=="usage-dashboard"||!p.exports?.["./gui-experimental"])process.exit(1)'
      - name: Verify balance presentation and IPC fallback
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./src/presentation.cjs');
          const a = {id:'openrouter:a',provider:'openrouter',kind:'api',source:'OpenCode',state:'ok',message:'ok',active:true,balance:{amount:0,currency:'USD',kind:'balance'},balances:[],windows:[],credits:null,checkedAt:42};
          const placeholder = {...a,active:false,state:'unavailable',message:'plugin_ipc_unavailable',balance:null,checkedAt:0};
          const prior = {accounts:[a]};
          const m = p.mergeInventoryFallback({accounts:[placeholder]},prior);
          assert.equal(m.accounts[0].balance.amount,0);
          assert.equal(m.accounts[0].state,'stale');
          assert.equal(m.accounts[0].message,'plugin_ipc_unavailable');
          assert.equal(p.mergeInventoryFallback({accounts:[{...placeholder,id:'openrouter:b'}]},prior).accounts[0].balance,null);
          assert.equal(p.mergeInventoryFallback({accounts:[]},prior).accounts.length,0);
          assert.equal(p.formatCurrency(0,'USD'),'$0.00');
          assert.equal(p.formatCurrency(0,'CNY'),'¥0.00');
          assert.equal(p.formatCurrency(null,'USD'),'—');
          const cache = require('./src/cache.cjs');
          const b = {...a,id:'openai:a',provider:'codex',balance:null,message:'api_key_connected'};
          const other = {...b,id:'openai:b'};
          const zen = {...b,id:'opencode:a',provider:'opencode'};
          const legacy = {accounts:[b,other,zen],browserBalance:{usd:7,currency:'USD'},zenBrowserBalance:{usd:0,currency:'USD'}};
          const sanitized=cache.sanitizeSnapshot(legacy);
          assert.equal(Object.hasOwn(sanitized,'browserBalance'),false);
          assert.equal(Object.hasOwn(sanitized,'zenBrowserBalance'),false);
          assert.equal(p.indicatorPresentation(b,legacy).amount,null);
          assert.equal(p.indicatorPresentation(zen,legacy).amount,null);
          const previous=cache.sanitizeSnapshot({...legacy,billingSessions:[{id:b.id,provider:b.provider,state:'ok',amount:0,checkedAt:42}]});
          assert.equal(p.indicatorPresentation(b,previous).amount,0);
          assert.equal(p.indicatorPresentation(other,previous).amount,null);
          assert.equal(p.indicatorPresentation(zen,previous).amount,null);
          const merged=p.mergeInventoryFallback({accounts:[b,other,zen]},previous);
          assert.equal(p.billingSessionBalance(b,merged).usd,0);
          assert.equal(merged.billingSessions[0].state,'stale');
          assert.equal(p.billingSessionBalance(other,merged),null);
          NODE
      - name: Verify Billing action responses
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs/promises');
          const os=require('node:os');
          const path=require('node:path');
          const {createBillingSessions}=require('./src/billing-session.cjs');
          (async()=>{
            const dir=await fs.mkdtemp(path.join(os.tmpdir(),'ud-billing-'));
            const a={id:'openai:test',provider:'codex',kind:'api',source:'OpenCode',message:'api_key_connected'};
            let snapshot={accounts:[a],billingSessions:[],inventoryWarning:'credentials_unavailable'};
            let refreshCount=0;
            const store={cached:async()=>snapshot,refresh:async()=>{refreshCount++;return snapshot;},
              setBillingSession:async(id,provider,s)=>{snapshot={...snapshot,billingSessions:s?[s]:[]};return snapshot;}};
            const service=createBillingSessions({directory:dir,store,chromiumLoader:()=>{throw Error('private path');}});
            try{
              const blocked=await service.action(a.id,'open');
              assert.equal(blocked.accepted,false);
              assert.equal(blocked.reason,'inventory_unavailable');
              assert.equal(refreshCount,1);
              snapshot={...snapshot,inventoryWarning:null};
              const missing=await service.action(a.id,'open');
              assert.equal(missing.accepted,true);
              assert.equal(missing.snapshot.billingSessions[0].state,'runtime_missing');
              assert.equal((await service.action('unknown','open')).reason,'account_unavailable');
              assert.equal((await service.action(a.id,'invalid')).reason,'invalid_action');
            }finally{await service.stop();await fs.rm(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify manual browser login boundary
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs/promises');
          const os=require('node:os');
          const path=require('node:path');
          const {createBillingSessions,startLoginBrowser}=require('./src/billing-session.cjs');
          const {EventEmitter}=require('node:events');
          (async()=>{
            const dir=await fs.mkdtemp(path.join(os.tmpdir(),'ud-manual-login-'));
            const a={id:'openai:test',provider:'codex',kind:'api',source:'OpenCode',message:'api_key_connected'};
            const url='https://platform.openai.com/settings/organization/billing/overview';
            let snapshot={accounts:[a],billingSessions:[],inventoryWarning:null};
            let running=true,manualLaunches=0,automatedLaunches=0,closed=0;
            const store={cached:async()=>snapshot,refresh:async()=>snapshot,
              setBillingSession:async(id,provider,s)=>{snapshot={...snapshot,billingSessions:s?[s]:[]};return snapshot;}};
            const page={url:()=>url,route:async()=>{},goto:async()=>{},evaluate:async()=>0};
            const context={pages:()=>[page],once:()=>{},close:async()=>{closed++;}};
            const service=createBillingSessions({directory:dir,store,
              browserFinder:async()=>({channel:'msedge',executablePath:'edge.exe'}),
              loginLauncher:async({url:target,profilePath})=>{
                manualLaunches++;assert.equal(target,url);assert.ok(profilePath.startsWith(dir));
                return {isRunning:()=>running};
              },
              chromiumLoader:()=>({launchPersistentContext:async(profilePath,options)=>{
                automatedLaunches++;assert.equal(options.headless,true);assert.ok(profilePath.startsWith(dir));return context;
              }})});
            try{
              assert.equal((await service.action(a.id,'open')).snapshot.billingSessions[0].state,'awaiting_confirmation');
              assert.equal(manualLaunches,1);assert.equal(automatedLaunches,0);
              assert.equal((await service.action(a.id,'confirm','https://accounts.google.com/')).reason,'invalid_billing_page');
              assert.equal((await service.action(a.id,'confirm',url)).snapshot.billingSessions[0].state,'close_login_browser');
              assert.equal(automatedLaunches,0);
              running=false;
              const result=await service.action(a.id,'confirm',url);
              assert.equal(result.snapshot.billingSessions[0].state,'ok');
              assert.equal(result.snapshot.billingSessions[0].amount,0);
              assert.equal(automatedLaunches,1);assert.equal(closed,1);
              const child=new EventEmitter();child.exitCode=null;child.signalCode=null;child.unref=()=>{};
              const native=await startLoginBrowser({browser:{executablePath:'edge.exe'},profilePath:dir,url,env:{OPENAI_API_KEY:'secret'},
                spawn:(executable,args,options)=>{
                  assert.equal(executable,'edge.exe');
                  assert.equal(options.shell,false);
                  assert.equal(options.env.OPENAI_API_KEY,undefined);
                  assert.ok(args.includes('--user-data-dir='+dir));
                  assert.ok(args.includes(url));
                  assert.ok(!args.some(a=>/remote-debugging|enable-automation|no-sandbox/.test(a)));
                  queueMicrotask(()=>child.emit('spawn'));return child;
                }});
              assert.equal(native.isRunning(),true);
            }finally{await service.stop();await fs.rm(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify independent Billing command transport
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {createBillingCommands}=require('./src/billing-session.cjs');
          (async()=>{
            let finish, calls=0;
            const task=new Promise(resolve=>{finish=resolve;});
            const cmd=createBillingCommands({action:async()=>{calls++;return task;}});
            const input={id:'openai:fixture',action:'open',ticket:'request-1'};
            assert.equal(cmd.submit(input),'queued');
            assert.equal(cmd.status(input),'pending');
            assert.equal(cmd.submit(input),'queued');
            assert.equal(cmd.submit({...input,ticket:'request-2'}),'busy');
            await new Promise(resolve=>setImmediate(resolve));
            assert.equal(calls,1);
            finish({accepted:false,reason:'inventory_unavailable'});
            await new Promise(resolve=>setImmediate(resolve));
            assert.equal(cmd.status(input),'inventory_unavailable');
            assert.equal(cmd.status({...input,ticket:'wrong'}),'unknown');
            assert.equal(cmd.submit({...input,action:'other'}),'invalid_action');
            cmd.stop();
            assert.equal(cmd.submit(input),'service_unavailable');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Package and verify archives without test scripts or secrets
        shell: bash
        run: |
          python3 tools/make-distributions.py
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, zipfile
          version=json.loads(Path('package.json').read_text())['version']
          for kind in ('Portable','Source'):
              path=Path('release')/f'Usage-Dashboard-{kind}-{version}.zip'
              assert path.is_file(), path
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert names and not any('/tests/' in '/'+name or name.endswith('Test-UsageDashboard.ps1') for name in names)
                  assert not any(name.endswith(('pairing.json','settings.json','binding.json','snapshot.json','.env')) for name in names)
                  assert not any('billing-sessions/' in name or '.usage-dashboard-userdata/' in name for name in names)
                  assert not any('/browser-extension/' in name or name.endswith(('/balance-bridge.cjs','/BROWSER_EXTENSION.md')) for name in names)
                  if kind == 'Portable':
                      assert 'Usage-Dashboard/vendor/playwright-core.tgz' in names
                      assert 'Usage-Dashboard/billing-runtime.json' in names
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Usage-Dashboard-test-build
          path: release/*.zip
          if-no-files-found: error

  windows-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem installer -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Invalid PowerShell: $($_.Name): $($errors -join '; ')" }
          }
      - name: Verify Billing Session browser selection
        shell: pwsh
        run: |
          @'
          const assert=require('node:assert/strict');
          const path=require('node:path');
          const {findBrowser}=require('./src/billing-session.cjs');
          (async()=>{
            const root=path.join(process.env.RUNNER_TEMP,'billing-browser-fixture');
            const edge=path.join(root,'Microsoft','Edge','Application','msedge.exe');
            const chrome=path.join(root,'Google','Chrome','Application','chrome.exe');
            const installed=new Set([edge,chrome]);
            const access=async p=>{if(!installed.has(p))throw Error('missing');};
            const env={ProgramFiles:root};
            assert.equal((await findBrowser(null,env,access)).executablePath,edge);
            installed.delete(edge);
            assert.equal((await findBrowser(null,env,access)).executablePath,chrome);
            installed.delete(chrome);
            assert.equal(await findBrowser(null,env,access),null);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Browser selection check failed' }
      - name: Clean-room installation and removal smoke check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'usage-dashboard-smoke'
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer failed' }
          $target = Join-Path $env:OPENCODE_CONFIG_DIR 'plugins/usage-dashboard'
          if (-not (Test-Path (Join-Path $target 'dist/gui-experimental.cjs'))) { throw 'Bundle missing after installation' }
          if (Test-Path -LiteralPath (Join-Path $target 'browser-extension')) { throw 'Retired companion installed' }
          $runtime = Join-Path $target 'node_modules/playwright-core/package.json'
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw 'Billing runtime missing' }
          $pin = Get-Content billing-runtime.json -Raw | ConvertFrom-Json
          if ((Get-Content -LiteralPath $runtime -Raw | ConvertFrom-Json).version -cne $pin.version) { throw 'Wrong Billing runtime' }
          $env:USAGE_DASHBOARD_SMOKE_PLUGIN = $target
          node -e "const path=require('node:path');const p=require(path.join(process.env.USAGE_DASHBOARD_SMOKE_PLUGIN,'node_modules','playwright-core'));if(typeof p.chromium?.launchPersistentContext!=='function')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Billing runtime cannot be loaded' }
          $env:USAGE_DASHBOARD_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'usage-dashboard-browser-smoke'
          @'
          const path=require('node:path');
          const fs=require('node:fs/promises');
          const {chromium}=require(path.join(process.env.USAGE_DASHBOARD_SMOKE_PLUGIN,'node_modules','playwright-core'));
          const {findBrowser,browserEnvironment,readBillingAmount}=require('./src/billing-session.cjs');
          (async()=>{
            const browser=await findBrowser();
            if(!browser)throw Error('No supported browser on Windows runner');
            const profile=process.env.USAGE_DASHBOARD_SMOKE_PROFILE;
            let context;
            try{
              context=await chromium.launchPersistentContext(profile,{
                channel:browser.channel,executablePath:browser.executablePath,headless:true,
                viewport:null,acceptDownloads:false,chromiumSandbox:true,timeout:15000,
                handleSIGINT:false,handleSIGTERM:false,handleSIGHUP:false,
                args:['--disable-background-mode','--disable-sync'],env:browserEnvironment(process.env)
              });
              const page=context.pages()[0]||await context.newPage();
              await page.setContent('<title>Usage Dashboard smoke</title><p>Credit balance</p><p>$0.00</p>');
              const value=await page.evaluate(readBillingAmount,'codex');
              if(value!==0)throw Error('Synthetic zero balance was not recognized');
            }finally{if(context)await context.close();await fs.rm(profile,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Billing browser launch smoke failed' }
          $saved = Join-Path $env:OPENCODE_CONFIG_DIR '.usage-dashboard-userdata'
          $legacy = Join-Path $target 'browser-extension'
          $savedLegacy = Join-Path $saved 'browser-extension'
          foreach ($folder in @($legacy,$savedLegacy)) {
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            foreach ($name in @('manifest.json','background.js','content.js','pairing.json')) {
              [IO.File]::WriteAllText((Join-Path $folder $name),'synthetic legacy fixture')
            }
          }
          $unrelated = Join-Path $savedLegacy 'user-note.txt'
          [IO.File]::WriteAllText($unrelated,'keep')
          $session = Join-Path $saved 'billing-sessions/test-profile'
          New-Item -ItemType Directory -Path $session -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $session 'fixture.txt'),'keep')
          $settings = Join-Path $target 'settings.json'
          [IO.File]::WriteAllText($settings,'{"refreshMinutes":17}')
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer upgrade failed' }
          if (Test-Path -LiteralPath $legacy) { throw 'Retired companion not removed' }
          if (Test-Path -LiteralPath (Join-Path $savedLegacy 'pairing.json')) { throw 'Retired saved pairing not removed' }
          if (-not (Test-Path -LiteralPath $unrelated)) { throw 'Unrelated file removed' }
          if (-not (Test-Path -LiteralPath (Join-Path $session 'fixture.txt'))) { throw 'Billing Session profile removed on upgrade' }
          if ((Get-Content -LiteralPath $settings -Raw | ConvertFrom-Json).refreshMinutes -ne 17) { throw 'Settings changed on upgrade' }
          & ./installer/Uninstall-UsageDashboard.ps1 -PurgeCachedData
          if (-not $?) { throw 'Uninstaller failed' }
          if (Test-Path $target) { throw 'Plugin still installed' }
