name: CI

on:
  push:
    branches: [main, fix/api-balance-availability]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and build checks
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.cjs browser-extension/*.js build.cjs; do node --check "$file"; done
          node build.cjs
          node --check dist/gui-experimental.cjs
          node -e 'const p=require("./package.json");if(p.name!=="usage-dashboard"||!p.exports?.["./gui-experimental"])process.exit(1)'
      - name: Verify balance presentation and IPC fallback
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./src/presentation.cjs');
          const a = {id:'openrouter:a',provider:'openrouter',kind:'api',source:'OpenCode',state:'ok',message:'ok',active:true,balance:{amount:0,currency:'USD',kind:'balance'},balances:[],windows:[],credits:null,checkedAt:42};
          const placeholder = {...a,active:false,state:'unavailable',message:'plugin_ipc_unavailable',balance:null,checkedAt:0};
          const prior = {accounts:[a]};
          const m = p.mergeInventoryFallback({accounts:[placeholder]},prior);
          assert.equal(m.accounts[0].balance.amount,0);
          assert.equal(m.accounts[0].state,'stale');
          assert.equal(m.accounts[0].message,'plugin_ipc_unavailable');
          assert.equal(p.mergeInventoryFallback({accounts:[{...placeholder,id:'openrouter:b'}]},prior).accounts[0].balance,null);
          assert.equal(p.mergeInventoryFallback({accounts:[]},prior).accounts.length,0);
          assert.equal(p.formatCurrency(0,'USD'),'$0.00');
          assert.equal(p.formatCurrency(0,'CNY'),'¥0.00');
          assert.equal(p.formatCurrency(null,'USD'),'—');
          const b = {...placeholder,id:'openai:a',provider:'codex'};
          const previous = {accounts:[b],browserBalance:{usd:0,currency:'USD',observedAt:42,source:'billing-page'}};
          assert.equal(p.browserBalanceFor(b,p.mergeInventoryFallback({accounts:[b]},previous)).usd,0);
          assert.equal(p.mergeInventoryFallback({accounts:[b,{...b,id:'openai:b'}]},previous).browserBalance,null);
          NODE
      - name: Package and verify archives without test scripts or secrets
        shell: bash
        run: |
          python3 tools/make-distributions.py
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, zipfile
          version=json.loads(Path('package.json').read_text())['version']
          for kind in ('Portable','Source'):
              path=Path('release')/f'Usage-Dashboard-{kind}-{version}.zip'
              assert path.is_file(), path
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert names and not any('/tests/' in '/'+name or name.endswith('Test-UsageDashboard.ps1') for name in names)
                  assert not any(name.endswith(('pairing.json','settings.json','binding.json','snapshot.json','.env')) for name in names)
                  assert not any('billing-sessions/' in name or '.usage-dashboard-userdata/' in name for name in names)
                  if kind == 'Portable':
                      assert 'Usage-Dashboard/vendor/playwright-core.tgz' in names
                      assert 'Usage-Dashboard/billing-runtime.json' in names
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Usage-Dashboard-test-build
          path: release/*.zip
          if-no-files-found: error

  windows-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem installer -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Invalid PowerShell: $($_.Name): $($errors -join '; ')" }
          }
      - name: Verify Billing browser selection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./installer/Common.ps1
          $fixture = Join-Path $env:RUNNER_TEMP 'billing-browser-fixture'
          $edge = Join-Path $fixture 'Microsoft\Edge\Application\msedge.exe'
          $chrome = Join-Path $fixture 'Google\Chrome\Application\chrome.exe'
          foreach ($file in @($edge,$chrome)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $file) | Out-Null
            New-Item -ItemType File -Force -Path $file | Out-Null
          }
          $browser = Get-BillingBrowser -InstallRoots @($fixture) -SkipRegistry
          if ($browser.Executable -ne $edge -or $browser.ExtensionsUrl -ne 'edge://extensions') { throw 'Edge must take priority' }
          Remove-Item -LiteralPath $edge
          $browser = Get-BillingBrowser -InstallRoots @($fixture) -SkipRegistry
          if ($browser.Executable -ne $chrome -or $browser.ExtensionsUrl -ne 'chrome://extensions') { throw 'Chrome fallback failed' }
          Remove-Item -LiteralPath $chrome
          if ($null -ne (Get-BillingBrowser -InstallRoots @($fixture) -SkipRegistry)) { throw 'Unexpected browser detected' }
      - name: Clean-room installation and removal smoke check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'usage-dashboard-smoke'
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer failed' }
          $target = Join-Path $env:OPENCODE_CONFIG_DIR 'plugins/usage-dashboard'
          if (-not (Test-Path (Join-Path $target 'dist/gui-experimental.cjs'))) { throw 'Bundle missing after installation' }
          foreach ($name in @('manifest.json','background.js','content.js','pairing.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $target "browser-extension/$name") -PathType Leaf)) { throw "Missing installed companion file: $name" }
          }
          $runtime = Join-Path $target 'node_modules/playwright-core/package.json'
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw 'Billing runtime missing' }
          $pin = Get-Content billing-runtime.json -Raw | ConvertFrom-Json
          if ((Get-Content -LiteralPath $runtime -Raw | ConvertFrom-Json).version -cne $pin.version) { throw 'Wrong Billing runtime' }
          $env:USAGE_DASHBOARD_SMOKE_PLUGIN = $target
          node -e "const path=require('node:path');const p=require(path.join(process.env.USAGE_DASHBOARD_SMOKE_PLUGIN,'node_modules','playwright-core'));if(typeof p.chromium?.launchPersistentContext!=='function')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Billing runtime cannot be loaded' }
          $pairing = Join-Path $target 'browser-extension/pairing.json'
          $before = [IO.File]::ReadAllText($pairing)
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer upgrade failed' }
          if ([IO.File]::ReadAllText($pairing) -cne $before) { throw 'Pairing changed on upgrade' }
          & ./installer/Uninstall-UsageDashboard.ps1 -PurgeCachedData
          if (-not $?) { throw 'Uninstaller failed' }
          if (Test-Path $target) { throw 'Plugin still installed' }
