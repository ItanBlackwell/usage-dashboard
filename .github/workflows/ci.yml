            const el=(tag,style,text='')=>({tag,style,textContent:text,childNodes:[],attrs:{},setAttribute(k,v){this.attrs[k]=v;},addEventListener(){},remove(){}});
            const add=(parent,child)=>(parent.childNodes.push(child),child);
            const all=n=>[n,...n.childNodes.flatMap(all)];
            const ctx={locale:{locale:()=> 'ru'}};
            const expanded=new Set();
            const local=new Function('$','add','palette','presentation','compactCard','providerLabel','note','Date','expandedAccountDetails','weeklyChart','weeklyChartState','document',
              source.slice(source.indexOf('function renderLocalUsage('),source.indexOf('function renderLimits('))+';return renderLocalUsage;')
              (el,add,{text:'#fff',muted:'#888',border:'#444'},p,parent=>add(parent,el('div','')),x=>x,x=>el('span','',x),class extends Date{static now(){return now;}},expanded,{render(){}},{key:null,day:null},{});
            const root=el('div','');local(ctx,root,{localUsage:usage},[{kind:'api',provider:'codex'},{kind:'api',provider:'codex'},{kind:'api',provider:'gemini'},{kind:'api',provider:'qwen'}]);
            const localDetails=all(root).find(n=>n.tag==='details');
            assert.equal(localDetails.open,false);
            assert.ok(all(localDetails).some(n=>n.tag==='summary'&&n.textContent==='Оценка расхода'));
            const quota={kind:'subscription',provider:'codex',source:'OpenCode',id:'openai:a',label:'Fixture A',windows:[{remainingPercent:60,resetsAt:now+3600000}]};
            const quotaRoot=el('div','');local(ctx,quotaRoot,{codexUsage:[{id:quota.id,fiveHour:{today:{from:u.periodStart('today',now),to:now,amount:12}}}]},[quota,{...quota,id:'openai:b',label:'Fixture B'}]);
            assert.equal(all(quotaRoot).filter(n=>n.tag==='details').length,1);
            assert.equal(all(quotaRoot).find(n=>n.tag==='details').open,false);
            assert.ok(all(quotaRoot).some(n=>n.textContent==='Fixture A'));
            assert.ok(all(quotaRoot).some(n=>n.textContent==='Fixture B'));
            assert.ok(all(quotaRoot).some(n=>n.textContent==='≈ 12 п.п.'));
            assert.equal(all(quotaRoot).filter(n=>n.textContent==='—').length,7);
            assert.equal(all(localDetails).filter(n=>n.textContent==='codex').length,1);
            assert.ok(all(root).some(n=>n.textContent==='≈ $0.005'));
            assert.ok(all(root).some(n=>n.textContent==='≈ $0.00'));
            assert.ok(all(root).some(n=>n.textContent==='Нет данных'));
            assert.ok(all(root).some(n=>n.textContent.includes('не списания')));
            const render=new Function('$','add','palette','money','currencyAmount','pct','displayWindow','expandedAccountDetails','presentation',
              source.slice(source.indexOf('function renderProviderDetails('),source.indexOf('function renderConsoleBudgets('))+';return renderProviderDetails;')
              (el,add,{muted:'#888'},v=>p.formatCurrency(v,'USD'),p.formatCurrency,n=>n+'%',(_,s)=>s,new Set(),p);
            const remote=el('div','');render(ctx,remote,{id:'openrouter:fixture',kind:'api',provider:'openrouter',state:'ok',message:'ok',
              metrics:[{code:'key_daily',currency:'USD',value:0.005},{code:'key_total',currency:'USD',value:2},{code:'byok_total',currency:'USD',value:1}],notices:[]});
            const visible=n=>[n,...(n.tag==='details'&&!n.open?n.childNodes.filter(x=>x.tag==='summary'):n.childNodes).flatMap(visible)];
            const remoteDetails=all(remote).find(n=>n.tag==='details');
            assert.equal(remoteDetails.open,false);
            assert.ok(!visible(remote).some(n=>n.textContent==='Баланс недоступен'||n.textContent==='Balance unavailable'));
            assert.equal(p.formatCurrency(null,'USD'),'—');
            assert.equal(p.formatCurrency(0,'USD'),'$0.00');
            assert.ok(!visible(remote).some(n=>n.textContent==='$0.005'||n.textContent==='Расход ключа · всего'));
            assert.ok(all(remoteDetails).some(n=>n.textContent==='$0.005'));
            remoteDetails.open=true;
            assert.ok(visible(remote).some(n=>n.textContent==='Расход ключа · всего'));
            assert.ok(!visible(root).some(n=>n.textContent==='≈ $0.005'));
            localDetails.open=true;
            assert.ok(visible(root).some(n=>n.textContent==='≈ $0.005'));
            const wallet=el('div','');render(ctx,wallet,{id:'deepseek:fixture',kind:'api',provider:'deepseek',state:'ok',message:'ok',
              balance:{kind:'balance',amount:0,currency:'USD'},metrics:[{code:'cash',currency:'USD',value:0},{code:'topped_up',currency:'USD',value:4}],notices:[]});
            assert.ok(!visible(wallet).some(n=>n.textContent==='Баланс недоступен'||n.textContent==='$4.00'));
            assert.ok(all(wallet).some(n=>n.textContent==='$4.00'));
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Package and verify archives without test scripts or secrets
        shell: bash
        run: |
          python3 tools/make-distributions.py
          (cd release && sha256sum *.zip) > "$RUNNER_TEMP/first-build.sha256"
          touch private-untracked-fixture.txt
          python3 tools/make-distributions.py
          rm private-untracked-fixture.txt
          (cd release && sha256sum -c "$RUNNER_TEMP/first-build.sha256")
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, zipfile
          version=json.loads(Path('package.json').read_text())['version']
          for kind in ('Portable','Source'):
              path=Path('release')/f'Usage-Dashboard-{kind}-{version}.zip'
              assert path.is_file(), path
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  assert names and not any('/tests/' in '/'+name or name.endswith('Test-UsageDashboard.ps1') for name in names)
                  assert not any(name.endswith(('pairing.json','settings.json','binding.json','snapshot.json','.env')) for name in names)
                  assert not any('billing-sessions/' in name or '.usage-dashboard-userdata/' in name for name in names)
                  assert not any('/browser-extension/' in name or name.endswith(('/balance-bridge.cjs','/BROWSER_EXTENSION.md')) for name in names)
                  assert not any('playwright' in name.lower() or name.endswith(('/billing-runtime.json','/BillingWindow.ps1','/billing-session.cjs','/BILLING_SESSION.md')) for name in names)
                  if kind == 'Portable':
                      assert 'Usage-Dashboard/Install.cmd' in names
                      assert 'Usage-Dashboard/Uninstall.cmd' in names
                      assert 'Usage-Dashboard/docs/OPENCODE_BUDGETS.md' in names
                      assert 'Usage-Dashboard/docs/PROVIDER_METRICS.md' in names
          PYCODE
      - name: Scan release archives for credential patterns
        run: python3 tools/check-release-secrets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Usage-Dashboard-test-build
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  windows-installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem installer -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "Invalid PowerShell: $($_.Name): $($errors -join '; ')" }
          }
      - name: Clean-room installation and removal smoke check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'usage-dashboard-smoke'
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer failed' }
          $target = Join-Path $env:OPENCODE_CONFIG_DIR 'plugins/usage-dashboard'
          if (-not (Test-Path (Join-Path $target 'dist/gui-experimental.cjs'))) { throw 'Bundle missing after installation' }
          foreach ($relative in @('installer/BillingWindow.ps1','node_modules/playwright-core','browser-extension')) {
            if (Test-Path -LiteralPath (Join-Path $target $relative)) { throw "Retired component installed: $relative" }
          }
          $saved = Join-Path $env:OPENCODE_CONFIG_DIR '.usage-dashboard-userdata'
          $legacy = Join-Path $target 'browser-extension'
          $savedLegacy = Join-Path $saved 'browser-extension'
          foreach ($folder in @($legacy,$savedLegacy)) {
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            foreach ($name in @('manifest.json','background.js','content.js','pairing.json')) {
              [IO.File]::WriteAllText((Join-Path $folder $name),'synthetic legacy fixture')
            }
          }
          $unrelated = Join-Path $savedLegacy 'user-note.txt'
          [IO.File]::WriteAllText($unrelated,'keep')
          $session = Join-Path $saved 'billing-sessions/test-profile'
          New-Item -ItemType Directory -Path $session -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $session 'fixture.txt'),'keep')
          $runtime = Join-Path $target 'node_modules/playwright-core'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $runtime 'package.json'),'{"name":"playwright-core"}')
          [IO.File]::WriteAllText((Join-Path $runtime '.usage-dashboard-integrity'),'sha512-fixture==')
          $unrelatedModule = Join-Path $target 'node_modules/unrelated'
          New-Item -ItemType Directory -Path $unrelatedModule -Force | Out-Null
          $oldHelper = Join-Path $target 'installer/BillingWindow.ps1'
          New-Item -ItemType Directory -Path (Split-Path $oldHelper) -Force | Out-Null
          [IO.File]::WriteAllText($oldHelper,'# synthetic retired helper')
          $settings = Join-Path $target 'settings.json'
          [IO.File]::WriteAllText($settings,'{"refreshMinutes":17}')
          & ./installer/Install-UsageDashboard.ps1 -PackageRoot (Get-Location).Path
          if (-not $?) { throw 'Installer upgrade failed' }
          if (Test-Path -LiteralPath $legacy) { throw 'Retired companion not removed' }
          if (Test-Path -LiteralPath $runtime) { throw 'Retired runtime not removed' }
          if (Test-Path -LiteralPath $oldHelper) { throw 'Retired helper not removed' }
          if (-not (Test-Path -LiteralPath $unrelatedModule)) { throw 'Unrelated module removed' }
          if (Test-Path -LiteralPath (Join-Path $savedLegacy 'pairing.json')) { throw 'Retired saved pairing not removed' }
          if (-not (Test-Path -LiteralPath $unrelated)) { throw 'Unrelated file removed' }
          if (-not (Test-Path -LiteralPath (Join-Path $session 'fixture.txt'))) { throw 'Retired private profile removed without purge' }
          if ((Get-Content -LiteralPath $settings -Raw | ConvertFrom-Json).refreshMinutes -ne 17) { throw 'Settings changed on upgrade' }
          & ./installer/Uninstall-UsageDashboard.ps1 -PurgeCachedData
          if (-not $?) { throw 'Uninstaller failed' }
          if (Test-Path $target) { throw 'Plugin still installed' }
