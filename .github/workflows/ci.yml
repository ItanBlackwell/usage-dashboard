name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static syntax and build checks
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.cjs build.cjs; do node --check "$file"; done
          cp dist/gui-experimental.cjs "$RUNNER_TEMP/committed-bundle.cjs"
          node build.cjs
          diff -u <(sed '/^ \* Source-Revision:/d' "$RUNNER_TEMP/committed-bundle.cjs") <(sed '/^ \* Source-Revision:/d' dist/gui-experimental.cjs)
          node --check dist/gui-experimental.cjs
          node -e 'const p=require("./package.json");if(p.name!=="usage-dashboard"||!p.exports?.["./gui-experimental"])process.exit(1)'
      - name: Verify updater release and checksum validation
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const u=require('./src/auto-update.cjs');
          assert.equal(u.newer('0.15.0','0.14.1'),true);
          assert.equal(u.newer('0.14.1','0.14.1'),false);
          assert.equal(u.newer('0.15.0-rc.1','0.14.1'),false);
          assert.equal(u.newer('0.9.0','0.14.1'),false);
          assert.equal(u.allowedUrl('https://evil.example/a'),false);
          assert.equal(u.allowedUrl('https://github.com/other/repo/releases/download/v1/x'),false);
          const name='Usage-Dashboard-Portable-0.15.0.zip',hash='a'.repeat(64);
          assert.equal(u.checksumFor(hash+'  '+name+'\n',name),hash);
          assert.throws(()=>u.checksumFor(hash+'  '+name+'\n'+hash+'  '+name,name));
          assert.equal(u.selectRelease({draft:false,prerelease:true,tag_name:'v0.15.0'},'0.14.1'),null);
          assert.throws(()=>u.selectRelease({draft:false,prerelease:false,tag_name:'v0.15.0',assets:[]},'0.14.1'));
          assert.throws(()=>u.readPortable(Buffer.alloc(22),'0.15.0'));
          NODE
      - name: Verify balance presentation and IPC fallback
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./src/presentation.cjs');
          const a = {id:'openrouter:a',provider:'openrouter',kind:'api',source:'OpenCode',state:'ok',message:'ok',active:true,balance:{amount:0,currency:'USD',kind:'balance'},balances:[],windows:[],credits:null,checkedAt:42};
          const placeholder = {...a,active:false,state:'unavailable',message:'plugin_ipc_unavailable',balance:null,checkedAt:0};
          const prior = {accounts:[a]};
          const m = p.mergeInventoryFallback({accounts:[placeholder]},prior);
          assert.equal(m.accounts[0].balance.amount,0);
          assert.equal(m.accounts[0].state,'stale');
          assert.equal(m.accounts[0].message,'plugin_ipc_unavailable');
          assert.equal(p.mergeInventoryFallback({accounts:[{...placeholder,id:'openrouter:b'}]},prior).accounts[0].balance,null);
          assert.equal(p.mergeInventoryFallback({accounts:[]},prior).accounts.length,0);
          assert.equal(p.formatCurrency(0,'USD'),'$0.00');
          assert.equal(p.formatCurrency(0,'CNY'),'¥0.00');
          assert.equal(p.formatCurrency(null,'USD'),'—');
          const cache = require('./src/cache.cjs');
          const b = {...a,id:'openai:a',provider:'codex',balance:null,message:'no_usage_endpoint'};
          const zen = {...b,id:'opencode:a',provider:'opencode'};
          const legacy = {accounts:[b,zen],browserBalance:{usd:7,currency:'USD'},zenBrowserBalance:{usd:0,currency:'USD'},
            billingSessions:[{id:b.id,provider:b.provider,state:'ok',amount:0,checkedAt:42}]};
          const sanitized=cache.sanitizeSnapshot(legacy);
          for(const key of ['browserBalance','zenBrowserBalance','billingSessions'])assert.equal(Object.hasOwn(sanitized,key),false);
          assert.equal(p.indicatorPresentation(b,legacy).amount,null);
          assert.equal(p.indicatorPresentation(zen,legacy).amount,null);
          NODE
      - name: Verify OpenCode Console budget and credit reads
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs/promises');
          const os=require('node:os');
          const path=require('node:path');
          const {collectAccounts,queryQuota,queryAdditional,parseOpenCodeBudgets,parseOpenCodeCreditBalance,readAllAccounts}=require('./src/accounts.cjs');
          const {sanitizeSnapshot,persistentMonitor}=require('./src/cache.cjs');
          const p=require('./src/presentation.cjs');
          const now=Date.now(),reset=new Date(now+86400000).toISOString();
          const policy=(extra={})=>({ruleID:'fixture-policy',limitDollars:25,spentDollars:12.125,scope:'each',per:'set',coverage:'all',
            models:[],vendors:[],picked:false,shared:false,resetsAt:reset,...extra});
          const billing={billingMode:'prepaid',mode:'pay-as-you-go',balanceMicroCents:'2786781005',creditLimitMicroCents:null,availableMicroCents:'2786781005'};
          const oauth=(id,org,server='https://opencode.ai/console')=>({id,integrationID:'opencode',active:id==='a',label:'Fixture '+id,
            value:{type:'oauth',access:'fixture-token-'+id,expires:now+600000,metadata:{orgID:org,server}}});
          const key={id:'key',integrationID:'opencode',label:'Key fixture',active:false,value:{type:'key',key:'fixture-api-key'}};
          const creds=[oauth('a','org_alpha'),oauth('b','wrk_beta','https://console.opencode.ai'),key];
          const entries=collectAccounts([],creds);
          const requests=[];
          const response=(body,status=200)=>({ok:status===200,status,json:async()=>body});
          const fetcher=async(url,options)=>{
            requests.push({url,options});
            assert.equal(options.method,'GET');assert.equal(options.redirect,'error');assert.equal(options.cache,'no-store');
            assert.ok(url.startsWith('https://opencode.ai/console/api/'));
            const token=options.headers.Authorization,org=options.headers['x-org-id'];
            if(token==='Bearer fixture-token-a')assert.equal(org,'org_alpha');
            else if(token==='Bearer fixture-token-b')assert.equal(org,'wrk_beta');
            else{assert.equal(token,'Bearer fixture-api-key');assert.equal(org,undefined);}
            const budget=url.endsWith('/policies/current-budgets');
            if(token==='Bearer fixture-token-b')return budget?response([policy({limitDollars:8,spentDollars:8})]):response({},403);
            if(token==='Bearer fixture-api-key')return budget?response({},403):response({...billing,balanceMicroCents:'0'});
            return budget?response([policy(),policy({ruleID:'shared',limitDollars:100,spentDollars:95,scope:'combined',shared:true}),
              policy({ruleID:'models',coverage:'models',per:'model',limitDollars:10,models:[{spentDollars:2},{spentDollars:7}]}),
              policy({ruleID:'unknown',coverage:'models',per:'model',models:[{}]})]):response(billing);
          };
          (async()=>{
            assert.equal(entries.length,3);assert.ok(entries.every(e=>e.kind==='api'));
            const accounts=await Promise.all(entries.map(entry=>queryQuota(entry,fetcher,now)));
            assert.equal(requests.length,6);
            const [a,b,k]=accounts;
            assert.equal(a.balance.amount,27.86781005);
            assert.equal(a.message,'experimental_balance');
            assert.equal(a.budgetMessage,'experimental_budget');
            assert.equal(a.budgets.length,4);
            assert.equal(p.tightestGeneralBudget(a,now).remainingUsd,5);
            assert.equal(a.budgets.find(b=>b.per==='model'&&b.spentUsd!==null).remainingUsd,3);
            assert.equal(a.budgets.find(b=>b.spentUsd===null).remainingUsd,null);
            assert.equal(b.balance,null);assert.equal(b.message,'forbidden');assert.equal(b.budgets[0].remainingUsd,0);
            assert.equal(p.indicatorPresentation(b,{}).metric,'budget');assert.equal(p.indicatorPresentation(b,{}).amount,0);
            assert.equal(k.balance.amount,0);assert.equal(k.budgetMessage,'forbidden');assert.deepEqual(k.budgets,[]);
            assert.equal(p.tightestGeneralBudget({...a,budgets:a.budgets.filter(x=>x.coverage==='models')},now),null);
            assert.equal(p.tightestGeneralBudget(a,Date.parse(reset)),null);
            assert.deepEqual(parseOpenCodeBudgets([]),[]);
            assert.equal(parseOpenCodeBudgets([policy({limitDollars:0,spentDollars:1})])[0].remainingUsd,0);
            assert.equal(parseOpenCodeBudgets([policy({limitDollars:1,spentDollars:3})])[0].remainingUsd,0);
            assert.throws(()=>parseOpenCodeBudgets([policy({spentDollars:null})]),/invalid_payload/);
            assert.throws(()=>parseOpenCodeBudgets([policy({limitDollars:'10'})]),/invalid_payload/);
            assert.throws(()=>parseOpenCodeBudgets([policy(),policy()]),/invalid_payload/);
            assert.throws(()=>parseOpenCodeCreditBalance({...billing,balanceMicroCents:null}),/invalid_balance/);
            assert.throws(()=>parseOpenCodeCreditBalance({...billing,balanceMicroCents:'-1'}),/invalid_balance/);
            assert.equal(parseOpenCodeCreditBalance({...billing,billingMode:'invoiced'}),null);
            assert.equal(parseOpenCodeCreditBalance({...billing,balanceMicroCents:'0'}).amount,0);
            const invalid=async(entry,message)=>{
              const result=await queryQuota(entry,async()=>{throw Error('must not send credential');},now);
              assert.equal(result.message,message);assert.equal(result.balance,null);assert.deepEqual(result.budgets,[]);
            };
            await invalid({...entries[0],consoleServer:'https://evil.invalid/console'},'unsupported_console');
            await invalid({...entries[0],consoleOrg:null},'workspace_required');
            await invalid({...entries[0],consoleOrg:'org_a\r\nbad'},'workspace_required');
            await invalid({...entries[0],expires:now-1},'login_expired');
            const none=await queryAdditional(entries[0],async(url)=>url.endsWith('/current-budgets')?response([]):response({},403));
            assert.equal(none.budgetMessage,'no_budgets');assert.equal(none.balance,null);
            const bad=await queryAdditional(entries[0],async()=>response({},401));
            assert.equal(bad.state,'error');assert.equal(bad.budgetMessage,'unauthorized');assert.equal(bad.message,'unauthorized');
            // The normal SDK inventory path must use each existing credential
            // without asking for new authorization or sharing workspace IDs.
            const result=await readAllAccounts({client:{integration:{list:async()=>[{id:'opencode',connections:creds.map(c=>({id:c.id,type:'credential',status:{status:'connected'}}))}]},
              credential:{list:async()=>creds}},fetcher,time:now,env:{}});
            assert.equal(result.accounts.length,3);
            const safe=sanitizeSnapshot({accounts:result.accounts,billingSessions:[{amount:100}],checkedAt:now});
            assert.equal(safe.accounts[0].balance.amount,a.balance.amount);
            assert.equal(p.tightestGeneralBudget(safe.accounts[0],now).remainingUsd,5);
            assert.equal(Object.hasOwn(safe,'billingSessions'),false);
            for(const privateValue of ['fixture-token','fixture-api-key','org_alpha','wrk_beta','balanceMicroCents','fixture-policy'])
              assert.ok(!JSON.stringify(safe).includes(privateValue),privateValue);
            const merged=p.mergeInventoryFallback({accounts:[{...b,budgets:[],balance:null,message:'plugin_ipc_unavailable'}]},safe);
            assert.equal(merged.accounts[0].budgets[0].remainingUsd,0);
            assert.equal(merged.accounts[0].state,'stale');
            const dir=await fs.mkdtemp(path.join(os.tmpdir(),'ud-budget-cache-'));
            let next=safe;
            const monitor=persistentMonitor({get:async()=>next},{directory:dir});
            try{
              await monitor.refresh(true);
              next={...safe,accounts:[{...safe.accounts[0],state:'error',message:'forbidden',budgetMessage:'forbidden',balance:null,budgets:[]}]};
              const denied=await monitor.refresh(true);
              assert.equal(denied.accounts[0].balance,null);
              assert.deepEqual(denied.accounts[0].budgets,[]);
              const disk=JSON.parse(await fs.readFile(path.join(dir,'snapshot.json'),'utf8'));
              assert.equal(Object.hasOwn(disk,'billingSessions'),false);
            }finally{monitor.stop();await fs.rm(dir,{recursive:true,force:true});}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify extended provider metrics and visible availability notices
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {queryQuota,parseOpenRouterKey,parseKimiCoding,parseMiniMaxQuota,parseZaiQuota}=require('./src/accounts.cjs');
          const {cleanMetrics,cleanNotices}=require('./src/provider-metrics.cjs');
          const {sanitizeSnapshot}=require('./src/cache.cjs');
          const presentation=require('./src/presentation.cjs');
          const now=Date.parse('2026-11-24T12:00:00Z'),reset='2026-11-25T12:00:00Z';
          const entry=(provider,extra={})=>({id:provider+':fixture',provider,integrationID:provider,kind:'api',source:'OpenCode',label:'Fixture',active:true,apiKey:'fixture-secret-'+provider,...extra});
          const response=(data,status=200)=>({ok:status===200,status,json:async()=>data});
          const read=(provider,body,extra={})=>queryQuota(entry(provider,extra),async(url,options)=>{
            assert.equal(options.method,'GET');assert.equal(options.redirect,'error');return response(body);
          },now);
          const val=(a,code,model=null)=>a.metrics.find(m=>m.code===code&&m.model===model)?.value;
          const notice=(a,group,status)=>a.notices.some(n=>n.group===group&&n.status===status);
          (async()=>{
            const deep=await read('deepseek',{is_available:false,balance_infos:[
              {currency:'USD',total_balance:'0',granted_balance:'0',topped_up_balance:'0'},
              {currency:'CNY',total_balance:'12',granted_balance:'2',topped_up_balance:'10'}]});
            assert.equal(deep.balance.amount,0);assert.equal(deep.balances.length,2);
            assert.equal(deep.metrics.filter(m=>m.code==='granted').length,2);
            assert.equal(deep.metrics.find(m=>m.code==='topped_up'&&m.currency==='CNY').value,10);
            assert.ok(notice(deep,'balance','insufficient_balance'));
            const kimi=await read('kimi',{status:true,code:0,data:{available_balance:5,cash_balance:-1,voucher_balance:5}},{integrationID:'moonshotai-cn'});
            assert.equal(kimi.balance.currency,'CNY');assert.equal(val(kimi,'cash'),-1);assert.equal(val(kimi,'voucher'),5);
            const missing=await read('deepseek',{is_available:true,balance_infos:[{currency:'USD',total_balance:'7'}]});
            assert.equal(missing.balance.amount,7);assert.equal(missing.metrics.length,0);
            assert.ok(notice(missing,'breakdown','not_returned'));
            const router={data:{limit:50,limit_remaining:17.5,limit_reset:'weekly',usage:90,usage_daily:1,usage_weekly:32.5,usage_monthly:60,
              byok_usage:4,byok_usage_daily:0,byok_usage_weekly:2,byok_usage_monthly:4,include_byok_in_limit:false,is_free_tier:false,expires_at:'2027-01-01T00:00:00Z',is_management_key:false,label:'do-not-store'}};
            const routerRead=await queryQuota(entry('openrouter'),async(url,options)=>{
              assert.equal(url,'https://openrouter.ai/api/v1/key');assert.equal(options.headers.Authorization,'Bearer fixture-secret-openrouter');
              return response(router);
            },now);
            assert.equal(routerRead.balance.kind,'key_limit');assert.equal(routerRead.keyBudget.remaining,17.5);
            assert.equal(routerRead.keyBudget.resetsAt,Date.parse('2026-11-30T00:00:00Z'));
            assert.equal(val(routerRead,'byok_daily'),0);assert.equal(val(routerRead,'key_total'),90);
            assert.ok(notice(routerRead,'balance','no_balance_access'));
            assert.equal(parseOpenRouterKey({data:{limit:null,limit_remaining:null,usage:0}},now).limit,null);
            assert.equal(parseOpenRouterKey({data:{limit:5,limit_remaining:-1}},now).limit.amount,0);
            const manager=await queryQuota(entry('openrouter'),async url=>url.endsWith('/key')?response({data:{...router.data,is_management_key:true}}):response({},403),now);
            assert.equal(manager.balance.amount,17.5);assert.ok(notice(manager,'balance','forbidden'));assert.equal(val(manager,'key_monthly'),60);
            const wallet=await queryQuota(entry('openrouter'),async url=>url.endsWith('/key')?response({data:{...router.data,is_management_key:true}}):response({data:{total_credits:100,total_usage:80}}),now);
            assert.equal(wallet.balance.kind,'balance');assert.equal(wallet.balance.amount,20);assert.equal(wallet.keyBudget.remaining,17.5);
            const oldCap={...routerRead,keyBudget:{...routerRead.keyBudget,resetsAt:Date.now()-1}};
            assert.equal(presentation.indicatorPresentation(oldCap,{}).amount,null);
            const cap={...routerRead,keyBudget:{...routerRead.keyBudget,resetsAt:Date.now()+86400000,expiresAt:null}};
            assert.equal(presentation.indicatorPresentation(cap,{}).metric,'budget');
            // New current-key contracts can include enforceable workspace and
            // member budgets even when the individual key limit is null.
            const future=new Date(Date.now()+86400000).toISOString();
            const policy=(scope,limit,spend,extra={})=>({scope,limit_usd:limit,spend_usd:spend,remaining_usd:limit-spend,
              reset_interval:'daily',resets_at:future,include_byok:false,guardrail_id:'private-guardrail-fixture',budget_id:'private-budget-fixture',...extra});
            const effective=policy('member',50,40),workspace=policy('workspace',100,80);
            const modern=await read('openrouter',{data:{limit:null,limit_remaining:null,usage:9,budgets:[workspace,effective],effective_budget:effective,
              free_model_daily_requests:{used:70,limit:100,remaining:30}}});
            assert.equal(modern.balance,null);
            assert.equal(modern.keyBudget.policies.length,2);
            assert.equal(modern.keyBudget.effective.remaining,10);
            assert.equal(presentation.openRouterBudget(modern).remaining,10);
            assert.equal(presentation.indicatorPresentation(modern,{}).metric,'budget');
            assert.equal(presentation.indicatorPresentation(modern,{}).amount,10);
            assert.equal(modern.keyBudget.freeDaily.remaining,30);
            assert.ok(!modern.notices.some(n=>n.group==='budget'));
            assert.ok(notice(modern,'balance','no_balance_access'));
            const cleanModern=sanitizeSnapshot({accounts:[modern]}).accounts[0];
            assert.equal(cleanModern.keyBudget.effective.remaining,10);
            assert.ok(!JSON.stringify(cleanModern).includes('private-guardrail-fixture'));
            assert.ok(!JSON.stringify(cleanModern).includes('private-budget-fixture'));
            assert.equal(presentation.openRouterBudget(modern,Date.parse(future)+1),null);
            const exhausted=policy('api_key',25,30);
            const zero=await read('openrouter',{data:{limit:null,limit_remaining:null,budgets:[exhausted],effective_budget:exhausted,
              free_model_daily_requests:{used:105,limit:100,remaining:0}}});
            assert.equal(zero.keyBudget.effective.remaining,0);assert.equal(zero.keyBudget.freeDaily.remaining,0);
            const absent=await read('openrouter',{data:{limit:null,limit_remaining:null,budgets:[],effective_budget:null}});
            assert.ok(notice(absent,'budget','no_applicable_budgets'));assert.equal(presentation.openRouterBudget(absent),null);
            const legacy=await read('openrouter',{data:{limit:null,limit_remaining:null}});
            assert.ok(notice(legacy,'budget','no_key_limit'));
            const malformed=await read('openrouter',{data:{limit:20,limit_remaining:15,budgets:[{...effective,remaining_usd:null}],effective_budget:effective}});
            assert.ok(notice(malformed,'budget','invalid_payload'));assert.equal(presentation.openRouterBudget(malformed),null);
            const claude=await queryQuota(entry('claude'),async(url,opts)=>{
              assert.equal(opts.headers['x-api-key'],'fixture-secret-claude');
              assert.equal(opts.headers['anthropic-beta'],'analytics-usage-cost-2026-08-24');
              const u=new URL(url);assert.equal(u.origin,'https://api.anthropic.com');assert.equal(u.searchParams.get('group_by[]'),'model');
              const common={data_refreshed_at:'2026-11-24T11:00:00Z',has_more:false};
              if(u.pathname.endsWith('/cost')){
                if(!u.searchParams.has('page'))return response({...common,has_more:true,next_page:'fixture-page',data:[{group:{model:'claude-sonnet-5'},cost:{currency:'USD',amount:'2500.000000'}}]});
                return response({...common,data:[{group:{model:null},cost:{currency:'USD',amount:'100.000000'}}]});
              }
              return response({...common,data:[{group:{model:'claude-sonnet-5'},usage:{total_tokens:1200,requests:3}}]});
            },now);
            assert.equal(claude.balance,null);assert.equal(val(claude,'org_month_cost'),26);
            assert.equal(val(claude,'org_model_cost','claude-sonnet-5'),25);assert.equal(val(claude,'org_month_tokens'),1200);
            assert.ok(notice(claude,'balance','unsupported'));
            const partial=await queryQuota(entry('claude'),async url=>url.includes('/cost?')?response({},403):response({data:[],has_more:false,data_refreshed_at:'2026-11-24T11:00:00Z'}),now);
            assert.ok(notice(partial,'cost','forbidden'));assert.equal(val(partial,'org_month_tokens'),0);
            const notReady=await read('claude',{data:[],has_more:false,data_refreshed_at:null});
            assert.equal(notReady.metrics.length,0);assert.ok(notice(notReady,'tokens','not_returned'));
            const code=parseKimiCoding({usage:{limit:'100',remaining:'30',resetTime:reset},limits:[{window:{duration:300,timeUnit:'TIME_UNIT_MINUTE'},detail:{limit:'100',used:'88',resetTime:reset}}],
              usages:{limit_5h:{used_ratio:0,reset_time:reset},limit_month_total:{used_ratio:.25,reset_time:reset}},
              extra_usage:{currency:'USD',balance_cents:250,total_cents:500,monthly_charge_limit_enabled:true,monthly_charge_limit_cents:2000,monthly_used_cents:350}});
            assert.equal(code.windows.find(w=>w.label==='5-hour').remainingPercent,12);
            assert.equal(code.windows.find(w=>w.label==='Monthly').remainingPercent,75);
            assert.equal(val(code,'extra_balance'),2.5);assert.equal(val(code,'extra_month_limit'),20);
            const codeZero=parseKimiCoding({code:0,data:{kind:'ok',quota:{usages:{limit5h:{usedRatio:0,resetAt:reset},monthCode:{usedRatio:.5,resetAt:reset}}}}});
            assert.equal(codeZero.windows.length,1);assert.equal(codeZero.windows[0].label,'Monthly · Code');
            assert.throws(()=>parseKimiCoding({code:1,usage:{limit:100,remaining:100}}),/invalid_payload/);
            const mini=parseMiniMaxQuota({base_resp:{status_code:0},model_remains:[
              {model_name:'MiniMax-M3',current_interval_total_count:100,current_interval_usage_count:70,end_time:Date.parse(reset),current_weekly_total_count:500,current_weekly_usage_count:0,current_weekly_end_time:Date.parse('2026-11-30T00:00:00Z')},
              {model_name:'MiniMax-M3.1',current_interval_total_count:100,current_interval_usage_count:25,end_time:Date.parse(reset)},
              {model_name:'video',current_interval_total_count:200,current_interval_usage_count:5},
              {model_name:'image',current_interval_total_count:0,current_interval_remaining_percent:100}]});
            assert.equal(mini.windows.find(w=>w.label==='5-hour').remainingPercent,25);
            assert.equal(mini.windows.find(w=>w.label==='Weekly').remainingPercent,0);
            assert.equal(mini.modelWindows.length,4);
            assert.ok(!mini.modelWindows.some(w=>w.model==='image'));
            assert.throws(()=>parseMiniMaxQuota({base_resp:{status_code:1004}}),/forbidden/);
            const zaiCalls=[];
            const zai=await queryQuota(entry('zai',{kind:'subscription',integrationID:'zai-coding-plan'}),async(url,opts)=>{
